name: Deploy send-email

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/send-email.yaml
      - send-email/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        url:
          - https://api.devel.hal9.com
          - https://next.hal9.ai
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v1
        with:
          python-version: "3.10"

      - name: Install Hal9
        run: pip install hal9

      - uses: actions/checkout@v1

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          since_last_remote_commit: true

      - name: Deploy send-email
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          HAL9_TOKEN: ${{ secrets.HAL9_DEVEL_TOKEN }}
        run: |
          if echo "${ALL_CHANGED_FILES}" | grep -qE "send-email/|\.github/workflows/send-email\.yaml"; then
            echo "send-email (or its workflow) changed — deploying to ${{ matrix.url }}"
            hal9 deploy send-email \
              --name send-email \
              --url ${{ matrix.url }} \
              --access public \
              --title "Send Email" \
              --description "Send emails via Resend using natural language prompts"
          else
            echo "No deployable send-email changes"
          fi